<!doctype html>
<html>
<head>
<title>Fill up form</title>
</head>
<body bgcolor="#aaccdd">
<font size="4">
<form method="post" action="">
<center> Sign up</center>
<hr width="40%" align="center">
<p>
<label>Username:</label>
<input type="text" maxlength="10" placeholder="Username"/>
<p>
<label>Password:</label>
<input type="password" maxlength="7" placeholder="Password"/>
<p>
<label>City:</label>
<select name="city" placeholder="City">
<option>City</option selected>
<option>Kolkata</option>
<option>Trenton</option>
<option>Miami</option>
<option>Orlando</option>
<option>Mumbai</option>
<option>Pune</option>
<option>Bengaluru</option>
</select>
<p>
<label>State:</label>
<select name="state" placeholder="State">
<option>State</option selected>
<option>Bengal</option>
<option>Karnataka</option>
<option>Bihar</option>
</select>
<p>
<label>Country:</label>
<select name="country" placeholder="country">
<option>India</option>
<option>U.S.A.</option>
<option>U.K.</option>
</select>
</font>
</body>
</html>
