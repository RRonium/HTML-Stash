<!Doctype HTML>
<HTML>
	<Head>
		<Title>
			xs;lx
		</Title>
		<Script type='text/javascript'>
		var day=parseInt(prompt("Enter a no. from 1 to 7"));
		switch(day)
		{
			case 1:
					alert('Sunday');
					break;
			case 2:
					alert('Monday');
					break;
			case 3:
					alert('Tuesday');
					break;
			case 4:
					alert('Wednesday');
					break;
			case 5:
					alert('Thursday');
					break;
			case 6:
					alert('Friday');
					break;
			case 7:
					alert('Saturday');
					break;
			default:
					alert("it is something else or another no. ");
		}
		</Script>
	</Head>
	<Body>
	</Body>
</HTML>
