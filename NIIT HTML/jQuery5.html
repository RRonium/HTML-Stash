<!DOCTYPE html>
<html>
<head>
<script src="jquery-2.1.3.min.js"></script>
<script>
$(document).ready(function(){
    $("#hide").click(function(){
        $("p").hide(3000);
    });
    $("#show").click(function(){
        $("p").show(1500);
    });
});
</script>
</head>
<body>

<p>If you click on the "Hide" button, I will disappear.</p>

<button id="hide">Hide</button>
<button id="show">Show</button>

</body>
</html>
