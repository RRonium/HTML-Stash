<HTML>
<head><title>The jQuery Example</title> 
<script type="text/javascript" src="jquery-2.1.3.min.js"></script>
<script type="text/javascript">
//hiding all <p>elements.
$(document).ready(function(){
$("p").click(function(){
$("h1").hide();
})

});
</script>
</head>
<body>
<p> Hello</p>
<h1>Hello World</h1>
<p> Hello1</p>
</body>
</html>
