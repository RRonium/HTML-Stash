<!doctype html>
<html>
<head>
<title>Javascript</title>
<script type="text/javascript">

var num;
var i;
num=parseInt(prompt("Enter a Number"));
var flag=0;
for(i=2;i<(num/2);i=i+1)
{
	if(num%i==0)
	{
		flag=1;
		break;
	}
}
if(flag==0)
{
		document.write("Number is prime");
}
else
{
		document.write("Number is not prime");
}
</script>
</head>
<body>
</body>
</html>
