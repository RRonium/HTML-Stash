<!doctype html>
<html>
<head>
<title>Vowels</title>
<script type="text/javascript">
	var character;
	character=prompt("Enter a character");
	switch(character)
	{
		case "a":
		case "A":
		case "e":
		case "E":
		case "o":
		case "O":
		case "i":
		case "I":
		case "u":
		case "U":
			alert("The entered charater is a vowel");
			break;
		default:
				alert("Entered letter is a consonent or somthing else");
	}
</script>
</head>
