<!doctype html>
<html>
<head>
<title>Javascript</title>
<script type="text/javascript">

	function Formscript()
	{	
		alert("Called");
		var name=document.getElementById("name").value;
		var age=document.getElementById("age").value;
		if(age<=12)
		{
			alert("You are a child");
		}
		
		else
		{
			alert("You are young");
		}
	}
</script>
</head>
<body>
<form name="form" onSubmit="Formscript()">
<label>name</label>
<input type="text" id="name" name="nm"/>
<br> 
<label>age</label>
<input type="text" id="age" name="ag"/>
<br>
<input type="submit" />
<input type="reset" />
</form>
