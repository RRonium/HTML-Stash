<!DOCTYPE HTML>
<HTML>
<BODY>
<CANVAS ID="myCanvas" width="300" height="300"
style="border:1px solid black">
</CANVAS>
<SCRIPT>
var c=document.getElementById('myCanvas');
var ctx=c.getContext('2d');
ctx.beginPath();
ctx.moveTo(200,20);
ctx.bezierCurveTo(80,20,80,100,250,100);
ctx.stroke();
</SCRIPT>
</BODY>
</HTML>
