<!DOCTYPE HTML>
	<HTML> 
		<HEAD>
			<STYLE> 
				@-webkit-keyframes myfirst /* Chrome */ 
				{ 
					0% {background:red;} 
					20% {background:green; } 
					40% {background:yellow;} 
					80% {background:red;} 
					100% {background:blue;}
				} 
				div 
				{
					width:100px; 
					height:100px; 
					background:red; 
					position:relative; 
					transition-duration: 10s;
					-webkit-animation-direction: alternate;
					-webkit-animation-delay: 10s;
					-webkit-animation-name:myfirst; /* Chrome */ 
					-webkit-animation-duration:5s; /* Chrome */ 
				}
			</STYLE>
	 	</Head>
		<Body>
			<Div></Div>
		</Body>
</HTML>
