<!doctype html>
<html>
<head>
<title>loop 4</title>
<script type="text/javascript">
	var num;
	
	
	num=2;
	while(num<=20)
	{
		var ctr=1;
		while(ctr<=10)
		{
			document.write(num*ctr+", ");
			ctr=ctr+1;
		}
		document.write("<BR>");
		num=num+1;
	}
</script></head>
<body>
</body>
</html>
