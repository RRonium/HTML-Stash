<!DOCTYPE HTML>
<HTML>
<HEAD>
<SCRIPT type="text/javascript" src="libraries\RGraph.common.core.js" ></SCRIPT>
<SCRIPT type="text/javascript" src="libraries\RGraph.bar.js" ></SCRIPT>
<TITLE>Bar chart</TITLE>
</HEAD>
<BODY>
<CANVAS id="canvas" width="500" height="350" ID="test" style="border:5px solid black">
</CANVAS>
<SCRIPT type="text/javascript" charset="utf-8">
var canvas = document.getElementById('canvas');

var ctx = canvas.getContext("2d");
var data = [5,68,32,25,20,51];

var colors = ["#7E3817", "#C35817", "#EE9A4D", "#A0C544", "#348017", "#307D7E"];

var center = [canvas.width / 2, canvas.height / 2];

var radius = Math.min(canvas.width, canvas.height) / 2;

var lastPosition = 0, total = 0;
for(var i in data) { total += data[i]; }
for (var i = 0; i < data.length; i++) {

ctx.fillStyle = colors[i];

ctx.beginPath();

ctx.moveTo(center[0],center[1]);

ctx.arc(center[0],center[1],radius,lastPosition,lastPosition+(Math.PI*2*(data[i]/total)),false);

ctx.lineTo(center[0],center[1]);

ctx.fill();

lastPosition += Math.PI*2*(data[i]/total);

}

</SCRIPT>
</BODY>
</HTML>
