<!Doctype HTML>
<HTML>
<Head>
	<Title>
		Demonstration of Table
	</Title>
	<style>
	th
	{
		font-size:18px;
		text-align:right;
		padding-top:5px;
		background-color:pink;
		color:#006400;
	}
	table
	{
		border:dotted 2px red;
		border-collapse:separate;
		width:400px;
		height:100px;
		text-align:center;
		padding:15px;
		color:blue;
		background-color:yellow;
	}
	</style>
</Head>
<Body>
	<table border="3" align="center">
	<caption>Details about the students</caption>
	<thead>
	<tr>
	   <th cellspacing="5" cellpadding="5">Roll no.</th>
	   <th cellspacing="5" cellpadding="5">Name</th>
	   <th cellspacing="5" cellpadding="5">Section</th>	
	   </tr>
	   </thead>
	   <tfoot>
	   <tr>
	   <td colspan="2">Total no. of students</td><td>3</td>
	   </tr>
	   </tfoot>
	   <tbody>
	   <tr>
	   <td>1</td><td>Sannidhya Biswas</td><td>A</td>
		</tr>
		<tr>
	   <td>2</td><td>Srijan Guchhiat</td><td>B</td>
		</tr>
		<tr>
	   <td>3</td><td>Shloke Sengupta</td><td>C</td>
		</tr>
	   
	</table>
</Body>
</HTML>
